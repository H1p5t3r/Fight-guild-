name: Native Godot combat lab
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    env:
      FIGHT_TOOLS: /tmp/fight-guild-tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64-posix libgl1 libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libasound2t64 libpulse0 libfontconfig1
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
      - uses: actions/cache@v4
        with:
          path: /tmp/fight-guild-tools
          key: godot-4.6.3-cpp-e83fd0904c-scons-4.9.1-${{ runner.os }}-v1
      - name: Build and validate native Godot client
        run: bash scripts/setup.sh
      - name: Build native release and Windows editor extensions
        run: |
          bash scripts/build-godot.sh target=template_release
          bash scripts/build-godot.sh platform=windows
          bash scripts/build-godot.sh platform=windows target=template_release
      - name: Export native PC packages
        run: |
          bash scripts/install-godot.sh --templates
          bash scripts/export-godot.sh
          python tests/exported_game.py
      - uses: actions/upload-artifact@v4
        with:
          name: FightGuild-native-PC
          path: |
            build/FightGuild-Windows.zip
            build/FightGuild-Linux.zip
            build/FightGuild-Godot-project.zip
          if-no-files-found: error
  portable-core-regression:
    runs-on: ubuntu-latest
    env:
      FIGHT_TOOLS: /tmp/fight-guild-web-tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash scripts/setup-web.sh
      - name: Package and verify browser Move Workshop
        run: |
          npx playwright install --with-deps chromium
          node scripts/build-workbench.mjs
          python scripts/build-locomotion-preview.py
          npm run test:workshop
      - uses: actions/upload-artifact@v4
        with:
          name: FightGuild-Move-Workshop
          path: |
            build/FightGuild-Move-Workshop.html
            exports/FightGuild-Movement-Preview.html
            docs/move-workshop.md
            exports/FightGuild-Move-Workshop-Guide.pdf
          if-no-files-found: error
