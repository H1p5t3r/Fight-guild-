name: Publish Move Workshop

on:
  push:
    branches: [feat/godot-combat-lab]
    paths:
      - '.github/workflows/workshop-pages.yml'
      - 'web/**'
      - 'core/**'
      - 'godot/assets/fighters/**'
      - 'godot/data/**'
      - 'godot/Content/Fonts/**'
      - 'scripts/build-workbench.mjs'
      - 'scripts/build-fillet-motion-review.mjs'
      - 'scripts/build-shark-motion-review.mjs'
      - 'scripts/build-smoke-motion-review.mjs'
      - 'art/characters/smoke-specials-v3/**'
      - 'art/characters/shark-kit-v2/**'
      - 'art/characters/fillet-v1/production/ground-twos/*.json'
      - 'art/characters/fillet-v1/production/sweep-timing/*.json'
      - 'art/characters/fillet-v1/production/kit-timing/*.json'
      - 'art/characters/fillet-v1/production/command-grabs-v2/*.json'
      - 'art/characters/fillet-v1/production/guide-audit-v1/**'
      - 'scripts/build.sh'
      - 'scripts/generate-combat-data.py'
      - 'scripts/package-workshop.py'
      - 'scripts/serve-workbench.mjs'
      - 'tests/workbench*'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: move-workshop-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      FIGHT_TOOLS: /tmp/fight-guild-workshop-tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the portable compiler
        run: python -m pip install --target "$FIGHT_TOOLS/python" ziglang==0.14.1
      - name: Install editor dependencies
        run: npm ci --no-audit --no-fund
      - name: Install supported browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Build the combat core
        run: bash scripts/build.sh
      - name: Build the browser editor
        run: node scripts/build-workbench.mjs
      - name: Verify hosted and extracted editor
        run: node tests/workbench-delivery-browser.mjs
      - name: Verify combo physics and mobile controls
        run: |
          ./build/combo-physics-tests
          node --test tests/combo-physics.test.mjs
          node scripts/verify-combo-decay.mjs
          node tests/workbench-combo-browser.mjs
      - name: Verify all Fillet animation review clips
        run: |
          ./build/fillet-v1-tests
          node --test tests/fillet-otg.test.mjs tests/workbench-fillet-otg.mjs
          node tests/workbench-fillet-v1-browser.mjs
          node tests/workbench-fillet-motion-review-browser.mjs
      - name: Verify Shark kit and Drive
        run: |
          ./build/shark-drive-tests
          node tests/workbench-shark-kit.mjs
          node tests/workbench-shark-kit-browser.mjs
      - name: Verify Smoke attack timing and review
        run: |
          ./build/smoke-tests
          node --test tests/workbench-smoke.mjs tests/workbench-smoke-specials.mjs
          node tests/workbench-smoke-attacks-browser.mjs
          node tests/workbench-smoke-specials-browser.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: FightGuild-Portable-Editor
          path: build/FightGuild-Move-Workshop.zip
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/move-workshop
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # GitHub requires an owner/admin to enable Pages once in repository settings.
      # The workflow token can publish subsequent updates but cannot enable it.
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
